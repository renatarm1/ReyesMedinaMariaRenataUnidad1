<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sneakers - Spring Summer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/CSS/Home.css">
    <link rel="stylesheet" href="./assets/CSS/Footer.css">
    <link rel="stylesheet" href="./assets/CSS/Auth.css">
    <link rel="stylesheet" href="./assets/CSS/Error.css">
    <link rel="stylesheet" href="./assets/CSS/Navbar.css">
    <link rel="stylesheet" href="./assets/CSS/Carrito.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
  <div id="mainContent">
      <!--  Hero Section -->
      <section class="hero-container" id="heroContainer">
        <video autoplay loop muted playsinline class="background-video"s>
          <source src="./assets/videos/adidas-runway.mp4" type="video/mp4">
          Tu navegador no soporta videos en HTML5.
        </video>
        <div class="text-background">
          <span class="text-right">SUMMER</span>
        </div>
        <div class="floating-card" id="adidasCard">
          <img src="https://images.unsplash.com/photo-1539185441755-769473a23570?q=80&w=600" id="carouselImage" alt="Adidas" />
        </div>
        <div class="text-front">
          <span class="text-left">SPRING</span>
        </div>
      </section>

      <!-- Products Section -->
      <section class="products-section">
        <h2 class="section-title">SELECTED ORIGINALS</h2>
        <div class="products-grid">
          
          <div class="product-card">
            <div class="product-image-wrapper">
              <img src="https://images.unsplash.com/photo-1539185441755-769473a23570?q=80&w=500" alt="Adidas 1">
            </div>
            <div class="product-shop-card">
              <span class="product-name">FORUM LOW CLASSIC</span>
              <span class="precio">$120 USD</span>
              <button class="add-to-cart-btn" data-name="FORUM LOW CLASSIC" data-price="120">
                Agregar 🛒
              </button>
            </div>
          </div>

          <div class="product-card">
            <div class="product-image-wrapper">
              <img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?q=80&w=500" alt="Adidas 2">
            </div>
            <div class="product-shop-card">
              <span class="product-name">ULTRABOOST LIGHT</span>
              <span class="precio">$190 USD</span>
              <button class="add-to-cart-btn" data-name="ULTRABOOST LIGHT" data-price="190">
                Agregar 🛒
              </button>
            </div>
          </div>

          <div class="product-card">
            <div class="product-image-wrapper">
              <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=500" alt="Adidas 3">
            </div>
            <div class="product-shop-card">
              <span class="product-name">SAMBA ALTERNATIVE ROAD</span>
              <span class="precio">$110 USD</span>
              <button class="add-to-cart-btn" data-name="SAMBA ALTERNATIVE ROAD" data-price="110">
                Agregar 🛒
              </button>
            </div>
          </div>

          <div class="product-card">
            <div class="product-image-wrapper">
              <img src="https://images.unsplash.com/photo-1552346154-21d32810aba3?q=80&w=500" alt="Adidas 4">
            </div>
            <div class="product-shop-card">
              <span class="product-name">NMD_R1 V3 DESIGN</span>
              <span class="precio">$160 USD</span>
              <button class="add-to-cart-btn" data-name="NMD_R1 V3 DESIGN" data-price="160">
                Agregar 🛒
              </button>
            </div>
          </div>

        </div>
      </section>
  </div>
  <script src="./views/Home.js"></script>
  <script src="./views/Auth.js"></script>  
  <script src="./views/Error.js"></script> 
  <script src="./components/Navbar.js"></script>
  <script src="./components/Footer.js"></script>
  <script src="./components/Carrito.js"></script>
</body>
</html>
